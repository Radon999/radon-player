# The rebuild branch (docs/rebuild/RADON_REBUILD_PLAN.md): every push is built and tested here, and nothing is
# published. All the tests run: the shared code's (shared/src/test) and the app's (app/src/test), which the Next build
# on android-work never ran. How it went is written to the rebuild-ci branch (result-linux.txt), as the other builds
# write ci/result.txt: readable without signing in.
name: Rebuild checks
on:
  push:
    branches: [rebuild]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: The DJ's voice, for its test (PocketVoiceTest)
        run: |
          curl -sSL --retry 4 --retry-all-errors -o "$RUNNER_TEMP/voice.tar.bz2" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2
          tar xjf "$RUNNER_TEMP/voice.tar.bz2" -C "$RUNNER_TEMP" && echo "RADON_VOICE_DIR=$RUNNER_TEMP/sherpa-onnx-pocket-tts-int8-2026-01-26" >> "$GITHUB_ENV" || true
      - name: Test and compile
        working-directory: android
        run: |
          chmod +x gradlew
          # packageDeb: Linux is a target again, so its installer must at least build (it isn't tested or published)
          ./gradlew --no-daemon --continue :shared:test :app:testDebugUnitTest :desktop:test :desktop:packageDeb > "$RUNNER_TEMP/build.log" 2>&1 || true
      # The package installed and the real app started, on a screen nobody sees (Xvfb), with data of its own: that it
      # starts and stays up, a picture of its window, what it wrote, and its Problems. Never fails the job.
      - name: Start the real app on Linux
        if: always()
        run: |
          out="$RUNNER_TEMP/linux-start.txt"
          deb=$(ls android/desktop/build/compose/binaries/main/deb/*.deb 2>/dev/null | head -1)
          {
            if [ -z "$deb" ]; then
              echo "LINUX START: no package to start"
            else
              sudo apt-get update -qq >/dev/null 2>&1 || true
              sudo apt-get install -y -qq xvfb imagemagick >/dev/null 2>&1 || true
              # The package asks for mpv and ffmpeg (the app runs them and does not bring them on Linux), and installing
              # it the way a person would (apt, which fetches what a package asks for) must bring them in
              echo "LINUX PACKAGE NEEDS: $(bash ci/linux-deps.sh "$deb" 2>&1 | tail -1)"
              sudo apt-get install -y -qq "./$deb" >/dev/null 2>&1 || sudo dpkg -i "$deb" >/dev/null 2>&1 || true
              echo "LINUX MPV: $(command -v mpv >/dev/null 2>&1 && mpv --version 2>/dev/null | head -1 || echo 'not installed by the package')"
              pkg=$(dpkg-deb -f "$deb" Package)
              exe=$(dpkg -L "$pkg" 2>/dev/null | grep -E '/bin/[^/]+$' | head -1)
              if [ -z "$exe" ]; then
                echo "LINUX START: the package installed, but no program was found in it ($pkg)"
              else
                export RADON_DATA="$RUNNER_TEMP/radon-data"; mkdir -p "$RADON_DATA"
                # The build server has no sound card: mpv plays into nothing (--ao=null), through a stand-in the app is
                # pointed at (RADON_MPV). Everything else is the app's own.
                printf '#!/bin/sh\nexec mpv --ao=null "$@"\n' > "$RUNNER_TEMP/mpv-quiet"; chmod +x "$RUNNER_TEMP/mpv-quiet"
                export RADON_MPV="$RUNNER_TEMP/mpv-quiet"
                tone="$RUNNER_TEMP/Linux test tone.flac"
                ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=40" -metadata title="Linux test tone" -metadata artist="Radon checks" "$tone" 2>/dev/null || true
                # A little music of the check's own for the app to read (RADON_MUSIC): two albums, a single, and a song
                # in a folder named Unreleased, so its tabs have something in them for the pictures below
                m="$RUNNER_TEMP/music"; export RADON_MUSIC="$m"
                song() { mkdir -p "$(dirname "$m/$1")"; ffmpeg -loglevel error -f lavfi -i "sine=frequency=$2:duration=20" -metadata title="$3" -metadata artist="$4" -metadata album="$5" -metadata track="$6" "$m/$1" 2>/dev/null || true; }
                song "Artists/Check Band/First Record/01 Alpha.flac" 330 "Alpha" "Check Band" "First Record" 1
                song "Artists/Check Band/First Record/02 Beta.flac" 350 "Beta" "Check Band" "First Record" 2
                song "Artists/Check Band/First Record/03 Gamma.flac" 370 "Gamma" "Check Band" "First Record" 3
                song "Artists/Other Voices/Night Drive/01 Dusk.flac" 390 "Dusk" "Other Voices" "Night Drive" 1
                song "Artists/Other Voices/Night Drive/02 Dawn.flac" 410 "Dawn" "Other Voices" "Night Drive" 2
                song "Artists/Other Voices/Lone - Single/Lone.flac" 430 "Lone" "Other Voices" "Lone - Single" 1
                song "Unreleased/Check Band/Demo Tape.flac" 450 "Demo Tape" "Check Band" "" 1
                Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
                sleep 3
                # A session bus, as a desktop has one: the app announces itself on it as a media player (MPRIS), which is
                # how a Linux desktop sends it the media keys. Asked below the way the desktop would.
                sudo apt-get install -y -qq dbus libglib2.0-bin >/dev/null 2>&1 || true
                DBUS_SESSION_BUS_ADDRESS=$(dbus-daemon --session --fork --print-address 2>/dev/null | head -1) || true
                export DBUS_SESSION_BUS_ADDRESS
                # A stand-in for the desktop's opener (xdg-open), which writes down what it is asked to open: there is no
                # browser here, and this shows that a link (Tidal's sign-in) really reaches the desktop
                mkdir -p "$RUNNER_TEMP/bin"
                printf '#!/bin/sh\necho "$@" >> "%s/opened.txt"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/xdg-open"; chmod +x "$RUNNER_TEMP/bin/xdg-open"
                export PATH="$RUNNER_TEMP/bin:$PATH"
                DISPLAY=:99 "$exe" > "$RUNNER_TEMP/app.log" 2>&1 &
                pid=$!
                sleep 45
                if kill -0 "$pid" 2>/dev/null; then
                  echo "LINUX START: the installed app started and was still running after 45 s"
                else
                  wait "$pid"; echo "LINUX START: the app stopped within 45 s (exit code $?)"
                fi
                # A song, asked for the way a person would from a command line (the app running takes it), then what
                # the app says is playing, twice, to see the time move
                if [ -f "$tone" ]; then
                  DISPLAY=:99 timeout 20 "$exe" "$tone" >/dev/null 2>&1 || true
                  sleep 8; one=$(DISPLAY=:99 timeout 20 "$exe" status 2>/dev/null | head -1)
                  sleep 6; two=$(DISPLAY=:99 timeout 20 "$exe" status 2>/dev/null | head -1)
                  echo "LINUX PLAY: asked to play a 40 s tone. After 8 s: ${one:-no answer}. After 14 s: ${two:-no answer}"
                else
                  echo "LINUX PLAY: no tone could be made (ffmpeg)"
                fi
                # The media keys, pressed the way a desktop presses them: over the session bus (MPRIS), while the tone plays
                if [ -n "$DBUS_SESSION_BUS_ADDRESS" ]; then
                  mp() { timeout 10 gdbus call --session --dest org.mpris.MediaPlayer2.radonplayer --object-path /org/mpris/MediaPlayer2 --method "$@" 2>&1 | tr '\n' ' ' | head -c 500; }
                  st() { mp org.freedesktop.DBus.Properties.Get org.mpris.MediaPlayer2.Player PlaybackStatus; }
                  says() { DISPLAY=:99 timeout 20 "$exe" status 2>/dev/null | head -1; }
                  echo "LINUX MEDIA KEYS: the app is on the bus as a media player: $(timeout 10 gdbus call --session --dest org.freedesktop.DBus --object-path /org/freedesktop/DBus --method org.freedesktop.DBus.NameHasOwner org.mpris.MediaPlayer2.radonplayer 2>&1 | tr '\n' ' ')"
                  echo "LINUX MEDIA KEYS: it says it is: $(st)"
                  echo "LINUX MEDIA KEYS: the song it shows: $(mp org.freedesktop.DBus.Properties.Get org.mpris.MediaPlayer2.Player Metadata)"
                  mp org.mpris.MediaPlayer2.Player.Pause >/dev/null; sleep 3
                  echo "LINUX MEDIA KEYS: after the Pause key: $(st) · the app: $(says)"
                  mp org.mpris.MediaPlayer2.Player.PlayPause >/dev/null; sleep 3
                  echo "LINUX MEDIA KEYS: after the Play/Pause key: $(st) · the app: $(says)"
                  echo "LINUX MEDIA KEYS: the player's name: $(mp org.freedesktop.DBus.Properties.Get org.mpris.MediaPlayer2 Identity)"
                else
                  echo "LINUX MEDIA KEYS: no session bus could be started here, so they were not tried"
                fi
                if DISPLAY=:99 import -window root "$RUNNER_TEMP/shot.png" 2>/dev/null && convert "$RUNNER_TEMP/shot.png" -resize 60% -quality 72 "$RUNNER_TEMP/linux-start.jpg" 2>/dev/null; then
                  echo "LINUX START: a picture of its window was taken (linux-start.jpg)"
                else
                  echo "LINUX START: no picture could be taken"
                fi
                # Each tab opened in turn, the way "Radon Player show albums" does from a command line, and a picture of
                # each: the screens as they are, all on one sheet (linux-screens.jpg), in this order
                tabs="music albums singles artists folders unreleased downloads playlists top skips queue settings"
                mkdir -p "$RUNNER_TEMP/shots"; n=10
                for t in $tabs; do
                  DISPLAY=:99 timeout 20 "$exe" show "$t" >/dev/null 2>&1 || true
                  sleep 4
                  DISPLAY=:99 import -window root "$RUNNER_TEMP/shots/$n-$t.png" 2>/dev/null || true
                  n=$((n + 1))
                done
                if montage "$RUNNER_TEMP"/shots/*.png -tile 3x -geometry 640x400+6+6 -background '#202020' "$RUNNER_TEMP/sheet.png" 2>/dev/null && convert "$RUNNER_TEMP/sheet.png" -quality 68 "$RUNNER_TEMP/linux-screens.jpg" 2>/dev/null; then
                  echo "LINUX SCREENS: pictures of $(ls "$RUNNER_TEMP/shots" | wc -l) tabs on one sheet (linux-screens.jpg): $tabs"
                else
                  echo "LINUX SCREENS: the sheet of pictures could not be made"
                fi
                # Each section of Settings opened in turn and pictured, on a sheet of its own (linux-settings.jpg)
                mkdir -p "$RUNNER_TEMP/sshots"; n=10
                for s in "General" "Personalization" "Playback" "Backup" "Remote & sync" "Accounts" "Your music" "Scanner" "Sound quality" "Last.fm & your stats"; do
                  DISPLAY=:99 timeout 20 "$exe" show settings "$s" >/dev/null 2>&1 || true
                  sleep 4
                  DISPLAY=:99 import -window root "$RUNNER_TEMP/sshots/$n.png" 2>/dev/null || true
                  n=$((n + 1))
                done
                if montage "$RUNNER_TEMP"/sshots/*.png -tile 2x -geometry 960x600+6+6 -background '#202020' "$RUNNER_TEMP/ssheet.png" 2>/dev/null && convert "$RUNNER_TEMP/ssheet.png" -quality 70 "$RUNNER_TEMP/linux-settings.jpg" 2>/dev/null; then
                  echo "LINUX SCREENS: Settings' $(ls "$RUNNER_TEMP/sshots" | wc -l) sections pictured on one sheet (linux-settings.jpg)"
                fi
                # A sign-in page (Tidal's), asked for the way its button asks: what the desktop's opener was handed
                DISPLAY=:99 timeout 20 "$exe" --tidal-login >/dev/null 2>&1 || true
                sleep 6
                if [ -s "$RUNNER_TEMP/opened.txt" ]; then
                  echo "LINUX LINKS: Tidal's sign-in was asked for, and the desktop's opener was handed: $(head -1 "$RUNNER_TEMP/opened.txt" | sed 's/[?].*//' | head -c 120)"
                else
                  echo "LINUX LINKS: Tidal's sign-in was asked for, and nothing was handed to the desktop's opener"
                fi
                DISPLAY=:99 import -window root "$RUNNER_TEMP/signin.png" 2>/dev/null && convert "$RUNNER_TEMP/signin.png" -resize 60% -quality 72 "$RUNNER_TEMP/linux-signin.jpg" 2>/dev/null || true
                kill "$pid" 2>/dev/null || true
                echo "--- what the app wrote as it started"
                tail -25 "$RUNNER_TEMP/app.log" 2>/dev/null
                echo "--- its Problems"
                find "$RADON_DATA" -name 'problems*' -exec tail -15 {} \; 2>/dev/null
                echo "--- the files it made: $(find "$RADON_DATA" -type f 2>/dev/null | wc -l)"
              fi
            fi
          } > "$out" 2>&1 || true
          cat "$out"
      - name: Say how it went
        if: always()
        run: |
          count() { # tests, failures+errors, suites of a results folder
            if ls "$1"/*.xml >/dev/null 2>&1; then
              python3 - "$1" <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          t = f = n = 0; bad = []
          for p in sorted(glob.glob(sys.argv[1] + "/*.xml")):
              s = ET.parse(p).getroot(); n += 1
              t += int(s.get("tests", 0)); k = int(s.get("failures", 0)) + int(s.get("errors", 0)); f += k
              for c in s.iter("testcase"):
                  if c.find("failure") is not None or c.find("error") is not None:
                      bad.append(c.get("classname", "") + "." + c.get("name", ""))
          print(f"{n} suites, {t} tests, {f} failed")
          for b in bad: print("  FAILED " + b)
          EOF
            else echo "no results (it didn't get that far)"; fi
          }
          {
            echo "commit $GITHUB_SHA · run $GITHUB_RUN_ID · $(date -u)"
            echo "SHARED TESTS: $(count android/shared/build/test-results/test)"
            echo "APP TESTS: $(count android/app/build/test-results/testDebugUnitTest)"
            echo "PC TESTS (the app's logic, started without a window): $(count android/desktop/build/test-results/test)"
            echo "THE DJ'S VOICE (Pocket TTS, made for real): $(grep -ho 'POCKET VOICE:[^<]*' android/desktop/build/test-results/test/*.xml 2>/dev/null | head -1 || true)$(grep -l 'PocketVoiceTest' android/desktop/build/test-results/test/*.xml 2>/dev/null | xargs -r grep -o 'skipped="[1-9]' | head -1 | sed 's/.*/ (skipped: the voice was not fetched)/')"
            if [ -d android/desktop/build/classes/kotlin/main ]; then echo "PC COMPILES: yes"; else echo "PC COMPILES: no"; fi
            deb=$(ls android/desktop/build/compose/binaries/main/deb/*.deb 2>/dev/null | head -1)
            if [ -n "$deb" ]; then echo "LINUX PACKAGE: $(basename "$deb"), $(du -h "$deb" | cut -f1)"; else echo "LINUX PACKAGE: not built"; fi
            grep -aE '^LINUX (START|PLAY|MPV|PACKAGE NEEDS|SCREENS|MEDIA KEYS|LINKS)' "$RUNNER_TEMP/linux-start.txt" 2>/dev/null || echo "LINUX START: not tried"
            echo "--- errors"
            grep -E "^e: |error:|What went wrong|FAILED" -A2 "$RUNNER_TEMP/build.log" | grep -v "^w: " | head -120
            echo "--- the end of the log"
            tail -30 "$RUNNER_TEMP/build.log"
          } > "$RUNNER_TEMP/result-linux.txt" || true
          cat "$RUNNER_TEMP/result-linux.txt"
      - name: Keep it (the rebuild-ci branch)
        if: always()
        run: |
          mkdir "$RUNNER_TEMP/r" && cd "$RUNNER_TEMP/r" && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q origin rebuild-ci; then git checkout -q -b rebuild-ci FETCH_HEAD; else git checkout -q --orphan rebuild-ci; fi
          cp "$RUNNER_TEMP/result-linux.txt" result-linux.txt
          cp "$RUNNER_TEMP/linux-start.txt" linux-start.txt 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-start.jpg" linux-start.jpg 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-screens.jpg" linux-screens.jpg 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-signin.jpg" linux-signin.jpg 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-settings.jpg" linux-settings.jpg 2>/dev/null || true
          # The app's own compiled code (three small jars, made from this branch's source and nothing else: no keys, no
          # installer), so a test build already on the PC can be brought up to date without a download that needs signing in
          rm -rf jars && mkdir jars
          for j in $(find "$GITHUB_WORKSPACE/android" -path '*build/libs/*.jar' | grep -E '/(desktop|shared|ui-common)[^/]*\.jar$'); do cp "$j" jars/; done
          echo "$GITHUB_SHA" > jars/COMMIT; ls -la jars
          git add -A
          git -c user.name=Radon999 -c user.email=Radon999@users.noreply.github.com commit -qm "ci: rebuild result for ${GITHUB_SHA::7}" || true
          git push -q origin rebuild-ci || true
  # The PC app on Windows: the same tests of the app's logic, and the installer built (not published). After the Linux
  # job, so the two don't write to rebuild-ci at once.
  windows:
    needs: linux
    if: always()
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: The DJ's voice, for its test (PocketVoiceTest)
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          curl -sSL --retry 4 --retry-all-errors -o "$T/voice.tar.bz2" https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-pocket-tts-int8-2026-01-26.tar.bz2
          (cd "$T" && (tar xjf voice.tar.bz2 || /c/Windows/System32/tar.exe -xf voice.tar.bz2)) && echo "RADON_VOICE_DIR=$(cygpath -w "$T/sherpa-onnx-pocket-tts-int8-2026-01-26")" >> "$GITHUB_ENV" || true
      - name: Test and build the installer
        working-directory: android
        run: |
          ./gradlew --no-daemon --continue :desktop:test :desktop:packageMsi > ../build-win.log 2>&1 || true
      - name: Say how it went
        if: always()
        run: |
          {
            echo "commit $GITHUB_SHA · run $GITHUB_RUN_ID · $(date -u)"
            n=$(ls android/desktop/build/test-results/test/*.xml 2>/dev/null | wc -l)
            t=$(grep -ho 'tests="[0-9]*"' android/desktop/build/test-results/test/*.xml 2>/dev/null | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
            f=$(grep -ho '\(failures\|errors\)="[0-9]*"' android/desktop/build/test-results/test/*.xml 2>/dev/null | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
            echo "PC TESTS ON WINDOWS: $n suites, tests $t, failed $f"
            echo "THE DJ'S VOICE ON WINDOWS: $(grep -ho 'POCKET VOICE:[^<]*' android/desktop/build/test-results/test/*.xml 2>/dev/null | head -1 || echo 'not made (skipped or failed)')"
            msi=$(ls android/desktop/build/compose/binaries/main/msi/*.msi 2>/dev/null | head -1)
            if [ -n "$msi" ]; then echo "WINDOWS INSTALLER: $(basename "$msi"), $(du -h "$msi" | cut -f1)"; else echo "WINDOWS INSTALLER: not built"; fi
            echo "--- errors"
            grep -E "^e: |error:|What went wrong|FAILED" -A6 build-win.log | grep -v "^w: " | head -120
            echo "--- the end of the log"
            tail -25 build-win.log
          } > result-windows.txt || true
          cat result-windows.txt
      - name: Keep it (the rebuild-ci branch)
        if: always()
        run: |
          here="$PWD"; r="$(mktemp -d)"; cd "$r" && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q origin rebuild-ci; then git checkout -q -b rebuild-ci FETCH_HEAD; else git checkout -q --orphan rebuild-ci; fi
          cp "$here/result-windows.txt" result-windows.txt
          git add -A
          git -c user.name=Radon999 -c user.email=Radon999@users.noreply.github.com commit -qm "ci: rebuild result (Windows) for ${GITHUB_SHA::7}" || true
          git push -q origin rebuild-ci || true
