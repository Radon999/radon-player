# The rebuild branch (docs/rebuild/RADON_REBUILD_PLAN.md): every push is built and tested here, and nothing is
# published. All the tests run: the shared code's (shared/src/test) and the app's (app/src/test), which the Next build
# on android-work never ran. How it went is written to the rebuild-ci branch (result-linux.txt), as the other builds
# write ci/result.txt: readable without signing in.
name: Rebuild checks
on:
  push:
    branches: [rebuild]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Test and compile
        working-directory: android
        run: |
          chmod +x gradlew
          # packageDeb: Linux is a target again, so its installer must at least build (it isn't tested or published)
          ./gradlew --no-daemon --continue :shared:test :app:testDebugUnitTest :desktop:test :desktop:packageDeb > "$RUNNER_TEMP/build.log" 2>&1 || true
      - name: Say how it went
        if: always()
        run: |
          count() { # tests, failures+errors, suites of a results folder
            if ls "$1"/*.xml >/dev/null 2>&1; then
              python3 - "$1" <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          t = f = n = 0; bad = []
          for p in sorted(glob.glob(sys.argv[1] + "/*.xml")):
              s = ET.parse(p).getroot(); n += 1
              t += int(s.get("tests", 0)); k = int(s.get("failures", 0)) + int(s.get("errors", 0)); f += k
              for c in s.iter("testcase"):
                  if c.find("failure") is not None or c.find("error") is not None:
                      bad.append(c.get("classname", "") + "." + c.get("name", ""))
          print(f"{n} suites, {t} tests, {f} failed")
          for b in bad: print("  FAILED " + b)
          EOF
            else echo "no results (it didn't get that far)"; fi
          }
          {
            echo "commit $GITHUB_SHA · run $GITHUB_RUN_ID · $(date -u)"
            echo "SHARED TESTS: $(count android/shared/build/test-results/test)"
            echo "APP TESTS: $(count android/app/build/test-results/testDebugUnitTest)"
            echo "PC TESTS (the app's logic, started without a window): $(count android/desktop/build/test-results/test)"
            if [ -d android/desktop/build/classes/kotlin/main ]; then echo "PC COMPILES: yes"; else echo "PC COMPILES: no"; fi
            deb=$(ls android/desktop/build/compose/binaries/main/deb/*.deb 2>/dev/null | head -1)
            if [ -n "$deb" ]; then echo "LINUX PACKAGE: $(basename "$deb"), $(du -h "$deb" | cut -f1)"; else echo "LINUX PACKAGE: not built"; fi
            echo "--- errors"
            grep -E "^e: |error:|What went wrong|FAILED" -A2 "$RUNNER_TEMP/build.log" | grep -v "^w: " | head -120
            echo "--- the end of the log"
            tail -30 "$RUNNER_TEMP/build.log"
          } > "$RUNNER_TEMP/result-linux.txt" || true
          cat "$RUNNER_TEMP/result-linux.txt"
      - name: Keep it (the rebuild-ci branch)
        if: always()
        run: |
          mkdir "$RUNNER_TEMP/r" && cd "$RUNNER_TEMP/r" && git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git fetch -q origin rebuild-ci; then git checkout -q -b rebuild-ci FETCH_HEAD; else git checkout -q --orphan rebuild-ci; fi
          cp "$RUNNER_TEMP/result-linux.txt" result-linux.txt
          git add -A
          git -c user.name=Radon999 -c user.email=Radon999@users.noreply.github.com commit -qm "ci: rebuild result for ${GITHUB_SHA::7}" || true
          git push -q origin rebuild-ci || true
