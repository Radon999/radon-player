# Radon Player Next: the one-codebase app (radon-player-next). Patches (ci/next/r*.patch.b64, applied in order on
# NEXT_BASE, Radon Player 2.1.2) are built and tested here: the shared code's tests, the phone's app (a side-by-side
# test app, "Radon Player Next", so 2.0 stays as it is) and the PC app (on Windows: an installer). With ci/next/PUSH
# present, the code goes to radon-player-next as one new commit (its first line: the branch; the rest: the message).
# ci/next/REMOVE: paths (one a line) taken out after the patches. ci/next/RELEASE (first line: the tag, second: the
# title, the rest: the notes): the phone app is built as the real one ("Radon Player", over 2.x) and, with ci/next/PUSH,
# a GitHub release is made on the pushed commit with RadonPlayer.apk and the
# PC's .msi. Delete both after a release.
# ci/next/files/: whole files copied over the patched code (FEATURE_GUIDE is made again from FEATURES.md after).
name: Next build
on:
  push:
    branches: [android-work]
    paths: ["ci/next/*.patch.b64", "ci/next/PUSH"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: next
  cancel-in-progress: false
env:
  NEXT_BASE: 1b67961807a4a9ef770847c7ff56f610ec621e3f
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      commit: ${{ steps.push.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-work
          path: work
      - uses: actions/checkout@v6
        with:
          ref: radon-player-next
          path: app
          fetch-depth: 0
      - name: Apply the patches
        working-directory: app
        run: |
          git fetch -q origin radon-player && git checkout -q "$NEXT_BASE"
          for f in $(ls ../work/ci/next/r*.patch.b64 | sort -V); do
            echo "applying $f"
            base64 -d "$f" | gunzip | git apply --whitespace=nowarn -
          done
          if [ -f ../work/ci/next/REMOVE ]; then grep . ../work/ci/next/REMOVE | xargs git rm -rq --ignore-unmatch --; fi
          if [ -d ../work/ci/next/files ]; then cp -r ../work/ci/next/files/. . && sed -i 's/\r$//' android/core/FEATURES.md android/core/CHANGELOG.md && { PYTHONUTF8=1 python3 android/core/gen-guide.py || PYTHONUTF8=1 python android/core/gen-guide.py; }; fi
          git add -A
          git -c user.name=Radon999 -c user.email=Radon999@users.noreply.github.com commit -qm "Radon Player Next" || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tidal's app keys
        working-directory: app
        run: |
          python -m pip install --quiet tidalapi
          OMARCHY_MUSIC_PYTHON=python android/tools/tidal-keys.sh
      - name: A side-by-side app, with the test key
        working-directory: app
        run: |
          base64 -d ../work/ci/test.keystore.b64 > "$RUNNER_TEMP/test.keystore"
          mkdir -p ~/.local/share/omarchy-music
          printf 'storeFile=%s\nstorePassword=varmusictest\nkeyAlias=test\nkeyPassword=varmusictest\n' "$RUNNER_TEMP/test.keystore" > ~/.local/share/omarchy-music/keystore.properties
          if [ -f ../work/ci/next/RELEASE ]; then echo "A release: the real app"; exit 0; fi
          sed -i 's/applicationId = "org.omarchy.music"/applicationId = "org.omarchy.music.next"/' android/app/build.gradle.kts
          sed -i 's/android:label="Radon Player"/android:label="Radon Player Next"/' android/app/src/main/AndroidManifest.xml
      - name: Build and test
        working-directory: app/android
        run: |
          ./gradlew --no-daemon --continue :shared:test :app:assembleRelease :desktop:packageUberJarForCurrentOS > "$RUNNER_TEMP/build.log" 2>&1 || true
      - name: Say how it went (ci/next/result.txt)
        if: always()
        working-directory: work
        run: |
          mkdir -p ci/next
          git config user.name Radon999; git config user.email Radon999@users.noreply.github.com
          { echo "run ${{ github.run_id }} · $(date -u)"; \
            if [ -f ../app/android/app/build/outputs/apk/release/app-release.apk ]; then echo "PHONE OK"; else echo "PHONE FAILED"; fi; \
            if ls ../app/android/desktop/build/compose/jars/*.jar >/dev/null 2>&1; then echo "PC OK"; else echo "PC FAILED"; fi; \
            if [ -d ../app/android/shared/build/test-results/test ]; then echo "TESTS: $(grep -ho 'tests="[0-9]*"\|failures="[0-9]*"' ../app/android/shared/build/test-results/test/*.xml | tr '\n' ' ')"; fi; \
            grep -E "^e: " "$RUNNER_TEMP/build.log" | sed 's#file:///home/runner/work/radon-player/radon-player/app/android/##' | sort -u | head -400; \
            grep -E "What went wrong|FAILED" -A3 "$RUNNER_TEMP/build.log" | head -40; \
            tail -25 "$RUNNER_TEMP/build.log"; } > ci/next/result.txt || true
          cp ../app/android/app/build/outputs/apk/release/app-release.apk ci/next/RadonPlayer-Next.apk || true
          J=$(ls ../app/android/desktop/build/compose/jars/*.jar 2>/dev/null | head -1); if [ -n "$J" ] && [ $(stat -c%s "$J") -lt 95000000 ]; then cp "$J" ci/next/RadonPlayer-Next-linux.jar; git add ci/next/RadonPlayer-Next-linux.jar; fi
          git add ci/next/result.txt; git add ci/next/RadonPlayer-Next.apk || true
          git -c user.name=Radon999 -c user.email=Radon999@users.noreply.github.com commit -qm "ci: next result" || true
          for i in 1 2 3 4 5; do git pull -q --rebase origin android-work || true; git push origin HEAD:android-work && break || sleep 15; done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: RadonPlayerNext-pc-jar
          path: app/android/desktop/build/compose/jars/*.jar
          if-no-files-found: ignore
      - name: A release?
        id: rel
        if: hashFiles('work/ci/next/RELEASE') != ''
        run: echo "tag=$(head -1 work/ci/next/RELEASE | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: steps.rel.outputs.tag != ''
        with:
          name: RadonPlayer-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: To radon-player-next
        id: push
        if: hashFiles('work/ci/next/PUSH') != ''
        working-directory: app
        run: |
          # Only a build that worked goes to the branch
          if ! grep -q "PHONE OK" ../work/ci/next/result.txt || ! grep -q "PC OK" ../work/ci/next/result.txt; then echo "The build failed: not pushed"; exit 0; fi
          git checkout -q -- android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml
          B="$(head -1 ../work/ci/next/PUSH | tr -d '[:space:]' | grep . || echo radon-player-next)"
          git fetch -q origin "$B"
          sed 1d ../work/ci/next/PUSH > "$RUNNER_TEMP/message"
          grep -q . "$RUNNER_TEMP/message" || echo "Radon Player Next" > "$RUNNER_TEMP/message"
          # The newest patch's own message (ci/next/N.msg beside N.patch.b64), when it has one
          LAST="$(ls ../work/ci/next/r*.patch.b64 | sort -V | tail -1)"
          [ -f "${LAST%.patch.b64}.msg" ] && cp "${LAST%.patch.b64}.msg" "$RUNNER_TEMP/message" || true
          C=$(git -c user.name=Radon999 -c user.email=Radon999@users.noreply.github.com commit-tree "HEAD^{tree}" -p FETCH_HEAD -F "$RUNNER_TEMP/message")
          git push origin "$C:refs/heads/$B"
          echo "commit=$C" >> "$GITHUB_OUTPUT"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-work
          path: work
      - uses: actions/checkout@v6
        with:
          ref: radon-player-next
          path: app
          fetch-depth: 0
      - name: Apply the patches
        shell: bash
        working-directory: app
        run: |
          git fetch -q origin radon-player && git checkout -q "$NEXT_BASE"
          for f in $(ls ../work/ci/next/r*.patch.b64 | sort -V); do tr -d '\r\n' < "$f" | base64 -d | gunzip | git apply --whitespace=nowarn -; done
          if [ -d ../work/ci/next/files ]; then cp -r ../work/ci/next/files/. . && sed -i 's/\r$//' android/core/FEATURES.md android/core/CHANGELOG.md && { PYTHONUTF8=1 python3 android/core/gen-guide.py || PYTHONUTF8=1 python android/core/gen-guide.py; }; fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: mpv and ffmpeg, for the installer to bring its own
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=app/android/desktop/resources/windows; mkdir -p "$D"
          A=$(gh release view -R shinchiro/mpv-winbuild-cmake --json assets -q '.assets[].name' | grep -E '^mpv-x86_64-[0-9]{8}-git-[0-9a-f]+\.7z$' | head -1)
          echo "mpv: $A"
          gh release download -R shinchiro/mpv-winbuild-cmake -p "$A" -D "$RUNNER_TEMP"
          7z e -y "$RUNNER_TEMP/$A" -o"$D" mpv.exe > /dev/null
          curl -sSfL -o "$RUNNER_TEMP/ff.zip" https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          7z e -y "$RUNNER_TEMP/ff.zip" -o"$D" ffmpeg.exe -r > /dev/null
          ls -la "$D"
          "$D/mpv.exe" --version | head -1; "$D/ffmpeg.exe" -hide_banner -version | head -1
      - name: The Windows media controls helper (radon-media.exe)
        shell: bash
        continue-on-error: true
        working-directory: app/android/desktop/smtc
        run: |
          dotnet publish -c Release -o out
          mkdir -p ../resources/windows && cp out/radon-media.exe ../resources/windows/
          ls -la ../resources/windows
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tidal's app keys
        shell: bash
        working-directory: app
        run: |
          python -m pip install --quiet tidalapi
          OMARCHY_MUSIC_PYTHON=python android/tools/tidal-keys.sh
      - name: The PC installer
        shell: bash
        working-directory: app/android
        run: ./gradlew --no-daemon :desktop:packageMsi
      - name: Keep the installer (for testing on the PC)
        shell: bash
        working-directory: work
        run: |
          M=$(ls ../app/android/desktop/build/compose/binaries/main/msi/*.msi 2>/dev/null | head -1)
          echo "installer: $(stat -c%s "$M") bytes"
          if [ -n "$M" ] && [ $(stat -c%s "$M") -lt 95000000 ]; then
            for i in 1 2 3 4 5; do
              git pull -q --rebase origin android-work || true
              cp "$M" ci/next/RadonPlayer-Next.msi; git add ci/next/RadonPlayer-Next.msi
              git -c user.name=Radon999 -c user.email=Radon999@users.noreply.github.com commit -qm "ci: next msi" || true
              git push origin HEAD:android-work && break || sleep 15
            done
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: RadonPlayerNext-windows
          path: app/android/desktop/build/compose/binaries/main/msi/*.msi
  release:
    needs: [build, windows]
    if: needs.build.outputs.tag != '' && needs.build.outputs.commit != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-work
          path: work
      - uses: actions/download-artifact@v7
        with:
          name: RadonPlayer-release-apk
          path: apk
      - uses: actions/download-artifact@v7
        with:
          name: RadonPlayerNext-windows
          path: msi
      - name: Check, then release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          cp apk/app-release.apk RadonPlayer.apk   # the app's only file name from 3.1.0 (3.0.1 and on look for it)
          M=$(ls msi/*.msi | head -1); cp "$M" "Radon-Player-$V.msi"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/aapt2" dump badging RadonPlayer.apk > badging.txt; head -1 badging.txt
          grep -q "package: name='org.omarchy.music' " badging.txt && grep -q "versionName='$V'" badging.txt
          "$tools/apksigner" verify --print-certs RadonPlayer.apk | tee certs.txt
          grep -q "certificate SHA-256 digest: ecb1d00a5af31235763dd087351edecf9237999628ad09002c481e1e152a76f9$" certs.txt
          ls -la RadonPlayer.apk "Radon-Player-$V.msi"
          TITLE="$(sed -n 2p work/ci/next/RELEASE)"; sed 1,2d work/ci/next/RELEASE > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --draft --title "$TITLE" --notes-file notes.md \
            RadonPlayer.apk "Radon-Player-$V.msi"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
