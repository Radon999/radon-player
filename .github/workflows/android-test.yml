# Test builds of the Android app from patches (ci/*.patch.b64, applied in order) on desktop-features
# as it was (BASE). The APK is a side-by-side test app (org.omarchy.music.test, "VarMusic Test"),
# signed with a test key kept here. With ci/PUSH present, the patched code goes to desktop-features.
name: Android test build
on:
  push:
    branches: [android-work]
    paths: ["ci/*.patch.b64", "ci/PUSH"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE: 1c15c06
    steps:
      - uses: actions/checkout@v6
        with:
          ref: android-work
          path: work
      - uses: actions/checkout@v6
        with:
          ref: desktop-features
          path: app
          fetch-depth: 0
      - name: Apply the patches
        working-directory: app
        run: |
          git checkout -q "$BASE"
          for f in $(ls ../work/ci/*.patch.b64 | sort -V); do
            echo "applying $f"
            base64 -d "$f" | gunzip | git apply --whitespace=nowarn -
          done
          git add -A
          git -c user.name=Radon999 -c user.email=radon721690@gmail.com commit -qm "Android: favorites, skips, a song's own volume, moods by hand, .m3u8 export, looks, visualizer and Wrapped styles, download folder, copies, Duplicates, Upgrade" || true
          git log --oneline -3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tidal's app keys
        working-directory: app
        run: |
          python -m pip install --quiet tidalapi
          OMARCHY_MUSIC_PYTHON=python android/tools/tidal-keys.sh
      - name: A test app, with the test key
        working-directory: app
        run: |
          base64 -d ../work/ci/test.keystore.b64 > "$RUNNER_TEMP/test.keystore"
          mkdir -p ~/.local/share/omarchy-music
          printf 'storeFile=%s\nstorePassword=varmusictest\nkeyAlias=test\nkeyPassword=varmusictest\n' "$RUNNER_TEMP/test.keystore" > ~/.local/share/omarchy-music/keystore.properties
          sed -i 's/applicationId = "org.omarchy.music"/applicationId = "org.omarchy.music.test"/' android/app/build.gradle.kts
          sed -i 's/android:label="VarMusic"/android:label="VarMusic Test"/' android/app/src/main/AndroidManifest.xml
          grep -n 'applicationId' android/app/build.gradle.kts
      - name: Build
        working-directory: app/android
        run: |
          ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/build.log" 2>&1 || true
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Say how it went (ci/result.txt)
        if: always()
        working-directory: work
        run: |
          { echo "run ${{ github.run_id }} · $(date -u)"; \
            if [ -f ../app/android/app/build/outputs/apk/release/app-release.apk ]; then echo "BUILD OK"; else echo "BUILD FAILED"; fi; \
            grep -E "^e: |^w: .*(unused|deprecated)? *$|error:|What went wrong" -A2 "$RUNNER_TEMP/build.log" | grep -v "^w: " | head -150; \
            tail -25 "$RUNNER_TEMP/build.log"; } > ci/result.txt || true
          cp ../app/android/app/build/outputs/apk/release/app-release.apk ci/VarMusic-Test.apk || true
          git add ci/result.txt ci/VarMusic-Test.apk || git add ci/result.txt
          git -c user.name=Radon999 -c user.email=radon721690@gmail.com commit -qm "ci: result" || true
          git push origin HEAD:android-work || true
      - uses: actions/upload-artifact@v6
        with:
          name: VarMusic-Test-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM (for the emulator)
        if: hashFiles('work/ci/SHOTS') != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          base64 -d work/ci/shots.sh.b64 > work/ci/shots.sh
          base64 -d work/ci/tap.py.b64 > work/ci/tap.py
      - name: Screenshots on an emulator
        if: hashFiles('work/ci/SHOTS') != ''
        continue-on-error: true
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash work/ci/shots.sh
      - name: Keep the screenshots (ci/shots/)
        if: hashFiles('work/ci/SHOTS') != ''
        working-directory: work
        run: |
          rm -rf ci/shots; mkdir -p ci/shots
          cp ../shots/*.png ci/shots/ 2>/dev/null || true
          cp ../shots-log.txt ci/shots/log.txt 2>/dev/null || true
          git add -A ci/shots
          git -c user.name=Radon999 -c user.email=radon721690@gmail.com commit -qm "ci: screenshots" || true
          git pull -q --rebase origin android-work || true
          git push origin HEAD:android-work || true
      - name: To desktop-features
        if: hashFiles('work/ci/PUSH') != ''
        working-directory: app
        run: |
          git checkout -q -- android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml
          B="$(head -1 ../work/ci/PUSH | tr -d '[:space:]' | grep . || echo desktop-features)"
          # ci/PUSH's first line names the branch (desktop-features if empty); never forced.
          # Any lines after it are the commit's message: then the patched code goes on top of
          # that branch as it is now, as one new commit.
          if sed 1d ../work/ci/PUSH | grep -q .; then
            git fetch -q origin "$B"
            sed 1d ../work/ci/PUSH > "$RUNNER_TEMP/message"
            C=$(git -c user.name=Radon999 -c user.email=radon721690@gmail.com commit-tree "HEAD^{tree}" -p FETCH_HEAD -F "$RUNNER_TEMP/message")
            git push origin "$C:refs/heads/$B"
          else
            git push origin HEAD:"refs/heads/$B"
          fi
